[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recdev"
version = "0.1.0"
description = "Reconhecedor facial (identificação fechada) para os datasets very-easy e easy"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pillow>=9.0",
    "facenet-pytorch>=2.5",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]