[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recdev"
version = "0.2.0"
description = "RecDev: reconhecimento facial com embeddings e PCA/SVD em very-easy, easy e medium"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "scikit-learn>=1.3",
    "numpy>=1.24,<2",
    "pillow>=10.2,<10.3",
    "facenet-pytorch==2.6.0",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
recdev = "recdev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
