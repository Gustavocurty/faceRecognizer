[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recdev"
version = "0.3.0"
description = "RecDev: identificação facial com rede pré-treinada e PCA/SVD"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "numpy>=1.24,<2",
    "pillow>=10.2,<10.3",
    "facenet-pytorch==2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
recdev = "recdev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
